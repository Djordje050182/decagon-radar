name: Daily Radar Scan

on:
  schedule:
    - cron: "0 1 * * *" # 01:00 UTC = 6pm San Francisco (full US news day captured), ~11am AEST
  workflow_dispatch:
    inputs:
      backfill:
        description: "Backfill mode (12 months podcasts / 30 days news)"
        type: boolean
        default: false
      rescan_brands:
        description: "Re-scan already-done videos for newly added brands (heavy: refetches all captions)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: radar-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - run: pip install -r scanner/requirements.txt

      - name: Git identity for progress pushes
        run: |
          git config user.name "decagon-radar-bot"
          git config user.email "actions@github.com"

      - name: Podcast mention scan
        id: scan
        continue-on-error: true
        env:
          PUSH_PROGRESS: "1"
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WEBSHARE_USER: ${{ secrets.WEBSHARE_USER }}
          WEBSHARE_PASS: ${{ secrets.WEBSHARE_PASS }}
          RESCAN_BRANDS: ${{ inputs.rescan_brands && '1' || '' }}
        run: python scanner/scan.py ${{ inputs.backfill && '--backfill' || '' }}

      - name: Competitor watch
        id: competitors
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scanner/competitors.py ${{ inputs.backfill && '--backfill' || '' }}

      - name: Trends synthesis
        id: trends
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scanner/trends.py

      - name: Commit updated data
        run: |
          git config user.name "decagon-radar-bot"
          git config user.email "actions@github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Daily scan $(date -u +%F)"
          git pull --rebase
          git push

      - name: Open digest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f digest_mentions.md ] || [ -f digest_competitors.md ]; then
            {
              cat digest_mentions.md 2>/dev/null || true
              echo ""
              cat digest_competitors.md 2>/dev/null || true
              echo ""
              echo "---"
              echo "Full dashboard: https://djordje050182.github.io/decagon-radar/"
            } > digest_full.md
            gh issue create \
              --title "Decagon Radar digest — $(date -u +%F)" \
              --body-file digest_full.md
          else
            echo "No new items today — no digest issue."
          fi

      # Data commits and the digest run above even when a pipeline step fails, but the
      # run itself must go red so GitHub emails the watcher — silent green runs once hid
      # 2.5 weeks of credit-exhaustion failures.
      - name: Surface pipeline failures
        if: steps.scan.outcome == 'failure' || steps.competitors.outcome == 'failure' || steps.trends.outcome == 'failure'
        run: |
          echo "A pipeline step failed (scan: ${{ steps.scan.outcome }}, competitors: ${{ steps.competitors.outcome }}, trends: ${{ steps.trends.outcome }})."
          echo "Most common cause: Anthropic credit balance exhausted — check the step logs above."
          exit 1
